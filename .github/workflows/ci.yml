name: CI Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend-windows:
    name: .NET 8 Build & Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore UniversalSigningBridge.sln

      - name: Build Solution (Release)
        run: dotnet build UniversalSigningBridge.sln --configuration Release --no-restore

      - name: Run Unit Tests
        run: dotnet test UniversalSigningBridge.sln --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

  frontend-build:
    name: React + Vite Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install NPM Dependencies
        run: npm ci

      - name: Run Frontend Build & Type Check
        run: npm run build

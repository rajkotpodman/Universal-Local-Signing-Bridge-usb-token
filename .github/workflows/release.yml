name: Multi-OS Release Packaging

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-frontend:
    name: Build Frontend Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build Web Assets
        run: |
          cd web
          npm ci
          npm run build
          cd ..

      - name: Upload Built Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/dist/

  package-release:
    name: Build & Package (${{ matrix.os }} - ${{ matrix.target }})
    needs: build-frontend
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: win-x64
            archive_format: zip
            output_name: UniversalLocalSigningBridge-Windows-x64
          - os: ubuntu-latest
            target: linux-x64
            archive_format: tar.gz
            output_name: UniversalLocalSigningBridge-Linux-x64
          - os: macos-latest
            target: osx-arm64
            archive_format: tar.gz
            output_name: UniversalLocalSigningBridge-macOS-arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: src/Bridge.Api/wwwroot

      - name: Publish Bridge.Api (${{ matrix.target }})
        run: >
          dotnet publish src/Bridge.Api/Bridge.Api.csproj
          -c Release
          -r ${{ matrix.target }}
          --self-contained false
          -o release-bundle

      - name: Copy Launcher Scripts and Documentation
        shell: bash
        run: |
          cp -r scripts release-bundle/scripts || true
          cp -r installer release-bundle/installer || true
          cp run.bat release-bundle/run.bat || true
          cp run-linux.sh release-bundle/run-linux.sh || true
          cp run-macos.sh release-bundle/run-macos.sh || true
          cp HOWTOUSE.md release-bundle/HOWTOUSE.md || true
          cp README.md release-bundle/README.md || true

      - name: Create Zip Archive (Windows)
        if: matrix.archive_format == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "release-bundle/*" -DestinationPath "${{ matrix.output_name }}.zip" -Force

      - name: Create Tar.Gz Archive (Unix)
        if: matrix.archive_format == 'tar.gz'
        shell: bash
        run: |
          tar -czvf "${{ matrix.output_name }}.tar.gz" -C release-bundle .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: ${{ matrix.output_name }}.${{ matrix.archive_format }}

  publish-github-release:
    name: Publish Official GitHub Release
    needs: package-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Release Archives
        uses: actions/download-artifact@v4
        with:
          path: all-releases

      - name: Move Release Archives to Root
        run: |
          mkdir -p release-assets
          find all-releases -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec mv {} release-assets/ \;
          ls -la release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.version }}
          name: Universal Local Signing Bridge ${{ github.ref_name || inputs.version }}
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true

name: Release Build & Package

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  package-windows:
    name: Package Windows Release Bundle
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build React Dashboard
        run: |
          cd web
          npm ci
          npm run build
          cd ..

      - name: Copy Frontend to Api wwwroot
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src/Bridge.Api/wwwroot" | Out-Null
          Copy-Item -Path "web/dist/*" -Destination "src/Bridge.Api/wwwroot" -Recurse -Force

      - name: Publish Bridge.Api (win-x64)
        run: >
          dotnet publish src/Bridge.Api/Bridge.Api.csproj
          -c Release
          -r win-x64
          --self-contained false
          -o release-output/bridge-service

      - name: Publish Bridge.Desktop Tray (win-x64)
        run: >
          dotnet publish src/Bridge.Desktop/Bridge.Desktop.csproj
          -c Release
          -r win-x64
          --self-contained false
          -o release-output/bridge-tray

      - name: Include Scripts and Manuals
        shell: pwsh
        run: |
          Copy-Item -Path "scripts" -Destination "release-output/scripts" -Recurse -Force
          Copy-Item -Path "HOWTOUSE.md" -Destination "release-output/HOWTOUSE.md" -Force
          Copy-Item -Path "README.md" -Destination "release-output/README.md" -Force

      - name: Create ZIP Archive
        shell: pwsh
        run: |
          Compress-Archive -Path "release-output/*" -DestinationPath "UniversalLocalSigningBridge-win-x64.zip" -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalLocalSigningBridge-win-x64
          path: UniversalLocalSigningBridge-win-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.version }}
          name: Universal Local Signing Bridge ${{ github.ref_name || inputs.version }}
          files: UniversalLocalSigningBridge-win-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
